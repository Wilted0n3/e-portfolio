<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcia Wilt</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://kit.fontawesome.com/ffd6d1cefc.js" crossorigin="anonymous"></script>
</head>
<body>
  <section id="about-me">
    <nav>
      <div class="personal__logo">Marcia Wilt</div>
      <ul class="nav__link--list">
        <li>
          <a href="#languages" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Languages</a>
        </li>
        <li>
          <a href="#projects" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black

        </li>
        <li>
          <a href="#contact" class="
          nav__link--anchor
          nav__link--anchor-primary

      </div>
